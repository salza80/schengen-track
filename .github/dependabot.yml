version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    # Haml 7.5 and Minitest 6 are not compatible with Prism 2.
    ignore:
      - dependency-name: "prism"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      routine-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/deployment"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "node"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
