name: Deploy App

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release revision; defaults to the triggering revision
        required: false
        type: string
        default: ''
      stack_name:
        required: true
        type: string
      cloudfront_distribution_id:
        required: true
        type: string
      robots_source:
        required: false
        type: string
        default: ''
      recache_urls_file:
        required: false
        type: string
        default: ''
      recache_profile:
        required: false
        type: string
        default: full
      smoke_base_url:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_ROLE_ARN: arn:aws:iam::360298971790:role/sst3-template-deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: deployment/.nvmrc

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-session-name: schengen-track-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Install CDK
        run: npm install -g aws-cdk@2.1146.1

      - name: Install CDK Dependencies
        run: npm ci
        working-directory: ./deployment

      - name: Build CDK and origin signer
        run: npm run build
        working-directory: ./deployment

      - name: Copy secrets file
        run: cp secrets.yml.example secrets.yml
        working-directory: ./src/config

      - name: Copy robots.txt override
        if: ${{ inputs.robots_source != '' }}
        env:
          ROBOTS_SOURCE: ${{ inputs.robots_source }}
        run: cp "$ROBOTS_SOURCE" ../public/robots.txt
        working-directory: ./src/config

      - name: CDK Deploy
        env:
          STACK_NAME: ${{ inputs.stack_name }}
        run: cdk deploy "$STACK_NAME" --require-approval never --method direct
        working-directory: ./deployment

      - name: Resolve Ops Lambda Function
        id: ops_lambda
        uses: ./.github/actions/resolve-ops-lambda
        with:
          stack-name: ${{ inputs.stack_name }}

      - name: Verify direct origin authentication
        env:
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' --output json > /tmp/origin-endpoints.json
          python3 deployment/scripts/check_origin_authentication.py /tmp/origin-endpoints.json

      - name: Run database migrations
        timeout-minutes: 20
        env:
          OPS_FUNCTION_NAME: ${{ steps.ops_lambda.outputs.ops_function_name }}
        run: ./deployment/scripts/invoke_ops_lambda.sh '{"command":"unlock_and_migrate"}' "Database migrations" /tmp/ops-response.json

      - name: Update countries data
        timeout-minutes: 20
        env:
          OPS_FUNCTION_NAME: ${{ steps.ops_lambda.outputs.ops_function_name }}
        run: ./deployment/scripts/invoke_ops_lambda.sh '{"command":"update_countries"}' "Countries data update" /tmp/update-countries.json

      - name: Verify shared rate-limit store
        timeout-minutes: 2
        env:
          OPS_FUNCTION_NAME: ${{ steps.ops_lambda.outputs.ops_function_name }}
        run: ./deployment/scripts/invoke_ops_lambda.sh '{"command":"verify_rate_limit_store"}' "Rate-limit store readiness" /tmp/rate-limit-readiness.json

  cacheInvalidate:
    runs-on: ubuntu-24.04
    needs: deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js for cache warm-up
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: deployment/.nvmrc

      - name: Copy secrets configuration for catalogue generation
        run: cp secrets.yml.example secrets.yml
        working-directory: src/config

      - name: Set up Ruby for country catalogue generation
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
          working-directory: src

      # Jobs have separate checkouts; generate the files on the warm-up runner.
      - name: Generate country catalogues for cache warm-up
        run: bundle exec rails country_catalog:generate
        working-directory: src

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-session-name: schengen-track-cache-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Set deployment timestamp
        run: |
          echo "Setting deployment timestamp in Parameter Store..."
          current_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          aws ssm put-parameter \
            --name "/schengen/deployment-timestamp" \
            --value "$current_time" \
            --type String \
            --overwrite
          echo "✓ Deployment timestamp set to: $current_time"

      - name: Perform CloudFront Invalidation
        id: cloudfront_invalidation
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id }}
        run: |
          set -euo pipefail
          invalidation_id=$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*' --query Invalidation.Id --output text)
          echo "invalidationId=${invalidation_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront Invalidation
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id }}
          INVALIDATION_ID: ${{ steps.cloudfront_invalidation.outputs.invalidationId }}
        run: aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$INVALIDATION_ID"

      - name: Wait for signed origin requests
        env:
          SMOKE_BASE_URL: ${{ inputs.smoke_base_url }}
        run: |
          set -euo pipefail
          for path in / /en/users/password/new; do
            status=$(curl --silent --show-error --fail --proto '=https' \
              --retry 20 --retry-delay 10 --retry-max-time 300 --retry-all-errors --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$SMOKE_BASE_URL$path")
            test "$status" = 200
          done

      - name: Run deployed smoke tests
        env:
          SMOKE_BASE_URL: ${{ inputs.smoke_base_url }}
        run: ./deployed_smoke_test.sh "$SMOKE_BASE_URL"
        working-directory: ./deployment/scripts

      - name: Recache main urls
        if: ${{ inputs.recache_urls_file != '' }}
        env:
          RECACHE_URLS_FILE: ${{ inputs.recache_urls_file }}
          RECACHE_PROFILE: ${{ inputs.recache_profile }}
        run: ./recache.sh "$RECACHE_URLS_FILE" "$RECACHE_PROFILE"
        working-directory: ./deployment/scripts
