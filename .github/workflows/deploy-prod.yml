name: Deploy-Prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      reuse_tests: ${{ steps.reuse.outputs.reuse_tests }}
    steps:
      - name: Pin production revision
        id: revision
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$RELEASE_REF" = refs/heads/master || { echo 'Production releases must use master.' >&2; exit 1; }
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: deployment/.nvmrc

      - name: Check previous staging tests
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: node deployment/scripts/reuse_staging_tests.cjs >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare
    if: needs.prepare.outputs.reuse_tests != 'true'
    uses: ./.github/workflows/test-suite.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  deploy:
    needs: [prepare, tests]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && ((needs.prepare.outputs.reuse_tests == 'true' && needs.tests.result == 'skipped') || needs.tests.result == 'success') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-app.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stack_name: SchengTrackProd
      cloudfront_distribution_id: E1KF4KLAR0V084
      recache_urls_file: urls-prod.txt
      smoke_base_url: https://schengen-calculator.com
