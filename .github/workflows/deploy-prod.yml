name: Deploy-Prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      reuse_tests: ${{ steps.reuse.outputs.reuse_tests }}
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: deployment/.nvmrc

      - name: Pin production revision
        id: revision
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: node deployment/scripts/release_revision.cjs >> "$GITHUB_OUTPUT"

      - name: Check previous staging tests
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: node deployment/scripts/reuse_staging_tests.cjs >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare
    if: needs.prepare.outputs.reuse_tests != 'true'
    uses: ./.github/workflows/test-suite.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  deploy:
    needs: [prepare, tests]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && ((needs.prepare.outputs.reuse_tests == 'true' && needs.tests.result == 'skipped') || needs.tests.result == 'success') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-app.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      stack_name: SchengTrackProd
      cloudfront_distribution_id: E1KF4KLAR0V084
      recache_urls_file: urls-prod.txt
      smoke_base_url: https://schengen-calculator.com
